# The bridge creates these same moving cylinders in Gazebo from planner markers.
# Their centres sweep across the final straight; the full-height mover requires
# lateral avoidance, while the low and hanging movers leave vertical options.
dynamic_obstacles:
  num: 3
  dyn_obs1:
    x: 748.0
    y: 0.0
    z: 40.0
    r: 6.0
    height: 80.0
    type: circular
    center: {x: 730.0, y: 0.0}
    radius: 18.0
    angular_velocity: 0.13
  dyn_obs2:
    x: 811.0
    y: 0.0
    z: 6.0
    r: 5.0
    height: 12.0
    type: circular
    center: {x: 795.0, y: 0.0}
    radius: 16.0
    angular_velocity: 0.18
  dyn_obs3:
    x: 854.0
    y: -8.0
    z: 26.0
    r: 5.0
    height: 28.0
    type: circular
    center: {x: 840.0, y: -8.0}
    radius: 14.0
    angular_velocity: 0.15

# Goals lie beyond the corresponding gates by more than the 48.825 m switch
# distance, so the obstructed goal remains active throughout each passage.
waypoints:
  num: 4
  wp1: {x: 280.0, y: 0.0, h: 8.0}
  wp2: {x: 440.0, y: 0.0, h: 8.0}
  wp3: {x: 640.0, y: 0.0, h: 24.0}
  wp4: {x: 940.0, y: 0.0, h: 8.0}

# Retained generator input; the mixed-course checker uses complex_validation.
vertical_validation:
  start_pose: [0.0, 0.0, 8.0, 0.0, 0.0, 0.0]
  ground_size: [2200.0, 600.0]
  camera_pose: [470.0, -900.0, 500.0, 0.0, 0.5, 1.5707963268]

complex_validation:
  radius: 7.2
  half_width: 80.0
  final_x: 880.0
  final_height: 8.0
  final_tolerance: 3.0
  timeout: 120.0
  dynamic_motion_min: 2.0
  dynamic_encounter_distance: 20.0
  gates:
    - {name: left_slalom, x: 90.0, direction: left, threshold: 7.2, goal_height: 8.0, goal_y: 0.0}
    - {name: right_slalom, x: 190.0, direction: right, threshold: -7.2, goal_height: 8.0, goal_y: 0.0}
    - {name: climb, x: 360.0, direction: above, threshold: 11.0, goal_height: 8.0, goal_y: 0.0}
    - {name: descent, x: 560.0, direction: below, threshold: 22.0, goal_height: 24.0, goal_y: 0.0}
