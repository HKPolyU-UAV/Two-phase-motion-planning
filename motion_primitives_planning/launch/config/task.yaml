static_obstacles:
  num: 12
  obs1: {x: 50.0, y: 0.0, r: 13.0}
  obs2: {x: 100.0, y: -50.0, r: 13.0}
  obs3: {x: 125.0, y: -50.0, r: 13.0}
  obs4: {x: 50.0, y: -100.0, r: 13.0}
  obs5: {x: 100.0, y: -125.0, r: 13.0}
  obs6: {x: 150.0, y: -125.0, r: 13.0}
  obs8: {x: 225.0, y: -175.0, r: 13.0}
  obs10: {x: 200.0, y: -200.0, r: 13.0}
  obs11: {x: 50.0, y: -187.0, r: 13.0}
  obs12: {x: 150.0, y: -237.0, r: 13.0}

# 动态障碍物（Dynamic Obstacles）
dynamic_obstacles:
  num: 3  # 假设添加 2 个动态障碍物
  dyn_obs1:
    x: 150.0
    y: -200.0
    r: 5.0
    type: "circular"  
    center: {x: 150.0, y: -175.0}  # 圆心
    radius: 20.0      # 半径
    angular_velocity: 0.5  # 角速度 (rad/s)
  dyn_obs2:
    x: 200.0
    y: -150.0
    r: 8.0
    type: "circular"  # 圆周运动
    center: {x: 200.0, y: -150.0}  # 圆心
    radius: 20.0      # 半径
    angular_velocity: 0.3  # 角速度 (rad/s)
  dyn_obs3:
    x: 250.0
    y: -250.0
    r: 5.0
    type: "circular"  # 圆周运动
    center: {x: 250.0, y: -250.0}  # 圆心
    radius: 30.0      # 半径
    angular_velocity: 0.3  # 角速度 (rad/s)

# 路径点（Waypoints）
waypoints:
  num: 4
  wp1: {x: 0.0, y: 0.0, h: 5}
  wp2: {x: 180.0, y: -75.0, h: 5}
  wp3: {x: 175.0, y: -200.0, h: 5}
  wp4: {x: 250.0, y: -250.0, h: 5}
