# 动态障碍物（Dynamic Obstacles）
dynamic_obstacles:
  num: 3  # 假设添加 2 个动态障碍物
  height: 10.0
  dyn_obs1:
    x: 150.0
    y: -200.0
    r: 5.0
    type: "circular"
    center: {x: 150.0, y: -175.0}  # 圆心
    radius: 20.0      # 半径
    angular_velocity: 0.5  # 角速度 (rad/s)
  dyn_obs2:
    x: 200.0
    y: -150.0
    r: 8.0
    type: "circular"  # 圆周运动
    center: {x: 200.0, y: -150.0}  # 圆心
    radius: 20.0      # 半径
    angular_velocity: 0.3  # 角速度 (rad/s)
  dyn_obs3:
    x: 250.0
    y: -250.0
    r: 5.0
    type: "circular"  # 圆周运动
    center: {x: 250.0, y: -250.0}  # 圆心
    radius: 30.0      # 半径
    angular_velocity: 0.3  # 角速度 (rad/s)

